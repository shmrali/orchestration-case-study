function cat(id){return cats.find(c=>c.id===id)||{id:'uncategorized',name:'Uncategorized',icon:'category',color:'#ddd',tone:''}}
function transactions(){let tx=baseTransactions.map(t=>({...t}));if(period==='sep'){const targets={food:10800,shopping:8900,transport:4100,bills:6000,entertainment:4400};for(const c of cats){let list=tx.filter(t=>t.category===c.id),categoryTotal=list.reduce((a,t)=>a+t.amount,0),used=0;list.forEach((t,i)=>{t.amount=i===list.length-1?targets[c.id]-used:Math.round(t.amount*targets[c.id]/categoryTotal);used+=t.amount})}}return tx.map(t=>({...t,category:changes[period+':'+t.id]||t.category}))}
function totals(){const tx=transactions();return cats.map(c=>({...c,amount:tx.filter(t=>t.category===c.id).reduce((a,t)=>a+t.amount,0)}))}
function total(){return transactions().reduce((a,t)=>a+t.amount,0)}
function activeTx(){return transactions().find(t=>t.id===currentTxId)||transactions()[0]}
function categorizationState(){const p=getParams(),s=p.get('categoryState')||p.get('state');return ['uncategorized','categorization-error'].includes(s)?s:''}
function shownCategory(t){return categorizationState()?cat('uncategorized'):cat(t.category)}
function month(short=false){return period==='oct'?(short?'Oct':'October'):(short?'Sep':'September')}
function href(screen,extra={}){const u=new URL(location.href);u.search='';u.searchParams.set('screen',screen);if(document.body.classList.contains('force-mobile'))u.searchParams.set('mode','mobile');else if(getParams().get('mode')==='web')u.searchParams.set('mode','web');if(period!=='oct')u.searchParams.set('period',period);Object.entries(extra).forEach(([k,v])=>u.searchParams.set(k,v));return u.pathname+u.search}
function go(screen,extra={}){const isModal=['edit-category','set-budget'].includes(screen);if(isModal&&!document.querySelector('.dialog'))focusReturnSelector=screen==='edit-category'?'[data-nav="edit-category"][data-tx="'+(extra.tx||currentTxId)+'"]':extra.category?'[data-nav="set-budget"][data-category="'+extra.category+'"]':'[data-nav="set-budget"]';history.pushState({},'',href(screen,extra));saveStatus='';selectedCategory='';saveFailedOnce=false;budgetStep='form';budgetError='';currentTxId=extra.tx||currentTxId;render();window.scrollTo(0,0)}
const brand=()=>`<div class="brand"><svg class="brand-mark" viewBox="0 0 36 40" fill="none" aria-hidden="true"><rect x="3" y="8" width="23" height="28" rx="7" stroke="currentColor" stroke-width="2.2"/><path d="M12 4h14a7 7 0 0 1 7 7v14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="m9 23 4 4 8-9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="brand-short">expense tracker<small>Make room for what matters</small></span></div>`;
function navLink(screen,label,i,active){return `<a href="${href(screen)}" data-nav="${screen}" class="nav-link ${active?'active':''}" ${active?'aria-current="page"':''}>${icon(i)}<span>${label}</span></a>`}
function periodControl(){return `<label class="period-control">${icon('calendar')}<span class="sr-only">Select period</span><select aria-label="Select period" data-period><option value="oct" ${period==='oct'?'selected':''}>October 2026</option><option value="sep" ${period==='sep'?'selected':''}>September 2026</option></select>${icon('down','down')}</label>`}
function layout(screen,content){let spending=['spending','category','transaction','edit-category'].includes(screen),planning=['budgets','set-budget','recurring'].includes(screen),title=spending?'Spending':planning?'Planning':screen==='data-use'?'Data use':'Overview';let html=`<aside class="sidebar">${brand()}<nav class="nav-group" aria-label="Primary">${navLink('overview','Overview','overview',screen==='overview')}${navLink('spending','Spending','spending',spending)}${navLink('budgets','Planning','wallet',planning)}</nav><div class="nav-heading">A LITTLE MORE CLARITY</div><nav class="nav-group" aria-label="Planning views">${navLink('recurring','Recurring payments','repeat',screen==='recurring')}${navLink('data-use','Data use & controls','shield',screen==='data-use')}</nav><div class="sidebar-bottom"><div class="sidebar-note"><span class="badge sample-badge">Sample data</span><p>A quieter way to understand your everyday spending.</p></div><div class="sidebar-profile"><div class="avatar" aria-hidden="true">AS</div><div><strong>Aarav Sharma</strong><p>Personal space · INR</p></div></div></div></aside><div class="app-body"><header class="mobile-header"><a href="${href('overview')}" data-nav="overview" aria-label="Expense Tracker overview">${brand()}</a><a href="${href('data-use')}" data-nav="data-use" class="avatar" aria-label="Data use and controls">AS</a></header><header class="topbar"><div class="topbar-title">${title}<span>Your personal space</span></div><div class="topbar-right"><span class="badge sample-badge">Sample data</span><span class="small">Thursday, 22 October</span><a class="icon-btn" href="${href('data-use')}" data-nav="data-use" aria-label="Data use and controls">${icon('shield')}</a><div class="avatar" aria-hidden="true">AS</div></div></header><main class="content" id="main-content">${content}</main><footer class="page-footer">${icon('lock')}<span>Design preview · Illustrative INR data · No bank connected</span></footer></div><nav class="bottom-nav" aria-label="Primary"><a href="${href('overview')}" data-nav="overview" class="${screen==='overview'?'active':''}" ${screen==='overview'?'aria-current="page"':''}>${icon('overview')}<span>Overview</span></a><a href="${href('spending')}" data-nav="spending" class="${spending?'active':''}" ${spending?'aria-current="page"':''}>${icon('spending')}<span>Spending</span></a><a href="${href('budgets')}" data-nav="budgets" class="${planning?'active':''}" ${planning?'aria-current="page"':''}>${icon('wallet')}<span>Planning</span></a><a href="${href('data-use')}" data-nav="data-use" class="${screen==='data-use'?'active':''}" ${screen==='data-use'?'aria-current="page"':''}>${icon('shield')}<span>Data use</span></a></nav>`;return html}
function pageHead(title,description='',options={}){return `<div class="page-head"><div class="page-title">${options.greeting?`<div class="greeting">Good morning, Aarav.</div>`:''}<h1>${title}</h1>${description?`<p class="dashboard-subhead">${description}</p>`:''}</div>${options.period?`<div class="web-inline-period">${periodControl()}</div><span class="badge sample-badge">Sample data</span>`:options.action||'<span class="badge sample-badge">Sample data</span>'}</div>`}
function sparkline(){let path=period==='oct'?'M0 55 C15 58 20 32 35 37 S55 59 72 42 S95 43 108 25 S131 38 145 23 S166 37 183 14 S205 26 221 10 S245 17 260 6 S280 9 296 2':'M0 58 C18 58 20 49 35 48 S59 35 72 34 S88 38 108 28 S133 34 145 17 S170 26 183 17 S202 8 221 12 S239 2 260 4 S283 0 296 0';return `<div class="spark-wrap"><svg class="spark" viewBox="0 0 300 65" preserveAspectRatio="none" aria-label="Illustrative daily spending trend" role="img"><defs><linearGradient id="chartFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff385c" stop-opacity=".13"/><stop offset="1" stop-color="#ff385c" stop-opacity="0"/></linearGradient></defs><path d="${path} L296 65 L0 65 Z" fill="url(#chartFade)"/><path d="${path}" fill="none" stroke="#ff385c" stroke-width="2"/><circle cx="296" cy="${period==='oct'?2:0}" r="3.2" fill="#ff385c"/></svg></div><div class="chart-dates"><span>${month(true)} 1</span><span>${month(true)} 8</span><span>${month(true)} 15</span><span>${month(true)} 22</span></div>`}
function transactionRows(list){return `<div class="transaction-list"><div class="table-header"><span class="merchant">Merchant</span><span class="cat">Category</span><span class="date">Date</span><span class="amount">Amount</span></div>${list.map(t=>{let c=cat(t.category);return `<a href="${href('transaction',{tx:t.id})}" data-nav="transaction" data-tx="${t.id}" class="transaction-row"><span class="round-icon ${c.tone}">${icon(t.icon)}</span><span class="tx-body"><span class="tx-name">${esc(t.name)}</span><span class="tx-meta" style="display:block">${c.name}</span></span><span class="desktop-col">${c.name}</span><span class="desktop-col">${t.day} ${month(true)} 2026</span><span class="tx-right"><span class="tx-amount">${money(t.amount)}</span><span class="tx-meta" style="display:block">${t.day} ${month(true)}</span></span></a>`}).join('')}</div>`}
function dashboard(){let state=getParams().get('state')||'success';let top=pageHead('Your money, at a glance.','A little clarity for your everyday.',{greeting:true,period:true})+`<div class="period-row">${periodControl()}<span class="period-note">1–22 ${month(true)}</span></div>`;if(state==='loading')return top+`<div role="status" aria-live="polite"><div class="skeleton-loading-grid"><div class="skeleton-summary soft-card"><div class="skeleton skeleton-block"></div><div class="skeleton skeleton-amount"></div><div class="skeleton skeleton-chart"></div></div><div class="skeleton-card"><div class="skeleton skeleton-block"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line"></div></div></div><div class="loading-label"><span class="spinner"></span>Getting your spending overview…</div></div>`;
if(state==='empty')return top+statePanel('empty','A fresh page for this month.','There are no eligible transactions in the selected period, so a spending summary is not available yet.','View available period','available-period')+`<div class="note-box">${icon('info')}<div><strong>Your overview will be here.</strong>Choose an available period to see your spending. An empty period doesn’t mean your data could not be retrieved.</div></div>`;
if(state==='error')return top+statePanel('warning','Your overview is unavailable.','We couldn’t retrieve your spending for this period. Your transactions have not been changed. Please try again.','Try again','retry-dashboard')+`<div class="note-box">${icon('shield')}<div><strong>Your information stays as it is.</strong>A retrieval problem does not mean there were no transactions this month.</div></div>`;
let totalValue=total(),prior=period==='oct'?34200:35800,delta=prior-totalValue,pct=(delta/prior*100).toFixed(1),topCat=totals().sort((a,b)=>b.amount-a.amount)[0],topShare=Math.round(topCat.amount/totalValue*100),categories=totals(),offset=0,gradient=categories.map(c=>{let start=offset;offset+=c.amount/totalValue*100;return`${c.color} ${start}% ${offset}%`}).join(',');
let comparisonState=getParams().get('comparison')||'success',hasComparison=!['unavailable','loading','error'].includes(comparisonState);let insight=getParams().get('insight')==='unavailable'?`<div class="insight-title">${icon('sparkles')}Top insight</div><h2>A little more context, soon.</h2><p>There isn’t enough supported information for an insight in this period.</p>`:!hasComparison?`<div class="insight-title">${icon('sparkles')}A little perspective</div><h2>${topCat.name} makes up ${topShare}% of your spending.</h2><p>A look at this period’s transactions can help put the everyday into perspective.</p><a href="${href('category',{category:topCat.id})}" data-nav="category" data-category="${topCat.id}" class="link">Explore this category ${icon('arrow')}</a>`:`<div class="insight-title">${icon('sparkles')}A little perspective</div><h2>You spent ${money(delta)} less this month.</h2><p>Your spending is ${pct}% lower than the same dates in ${period==='oct'?'September':'August'}. A helpful moment to see what changed.</p><a href="${href('category')}" data-nav="category" class="link">Explore your spending ${icon('arrow')}</a>`;
return top+`<section class="summary-grid" aria-label="Spending summary"><div class="total-section"><div class="total-label">Total spent · 1–22 ${month()} 2026</div><div class="total-value num"><sup>₹</sup>${totalValue.toLocaleString('en-IN')}</div>${hasComparison?`<div class="comparison"><span class="change">${icon('trend')}${pct}% less</span><span>than 1–22 ${period==='oct'?'September':'August'}</span></div>`:`<div class="comparison">${comparisonState==='loading'?'Checking month comparison…':comparisonState==='error'?'Month comparison is unavailable.':'Previous-month comparison is not available.'}</div>`}${sparkline()}<div class="total-caption">${transactions().length} transactions, one clearer picture.</div></div>${comparisonCard(totalValue,prior,delta)}</section><div class="workspace-grid"><section class="card spending-card"><div class="section-head"><h2>Where it all went</h2><span class="muted small">${cats.length} categories</span></div><div class="category-chart"><div class="donut" style="background:conic-gradient(${gradient})" role="img" aria-label="Spending across five categories"><div class="donut-label"><strong>${topShare}%</strong><span>${topCat.name}</span></div></div><div class="chart-side"><strong>Your everyday, in perspective.</strong>${topCat.name} was your largest category this period.</div></div>${categories.map(c=>`<a class="legend-row" href="${href('category',{category:c.id})}" data-nav="category" data-category="${c.id}"><span class="dot" style="background:${c.color}"></span><span class="legend-name">${c.name}</span><strong class="num">${money(c.amount)}</strong><span class="percent">${Math.round(c.amount/totalValue*100)}%</span>${icon('chevron')}</a>`).join('')}</section><aside><section class="insight-card">${insight}</section><section class="planning-mini"><div class="mini-head"><span class="round-icon">${icon('wallet')}</span><div><h3>A plan that fits your everyday</h3><p>Keep your category budgets in view.</p></div></div><div class="progress" aria-label="Food and drinks budget used"><span style="width:${Math.min(100,categories.find(c=>c.id==='food').amount/(budgets.food||10000)*100)}%"></span></div><div class="progress-meta"><span>Food & drinks</span><span>${money(categories.find(c=>c.id==='food').amount)} / ${money(budgets.food||10000)}</span></div><a href="${href('budgets')}" data-nav="budgets" class="link">See your budgets ${icon('arrow')}</a></section></aside></div><section class="recent-section"><div class="section-head"><h2>Recent activity</h2><a href="${href('spending')}" data-nav="spending" class="link">View spending ${icon('arrow')}</a></div>${transactionRows(transactions().slice(0,4))}<div class="quiet-strip">${icon('category')}<span>Categories help you see the bigger picture. You can correct any transaction.</span></div></section>`}
function comparisonCard(totalValue,prior,delta){const state=getParams().get('comparison')||'success',previous=period==='oct'?'September':'August';if(['unavailable','loading','error'].includes(state)){const copy=state==='loading'?`Checking ${previous} information. Your ${month()} summary is already available.`:state==='unavailable'?`${previous} information isn’t available. You can still see your ${month()} spending.`:`We couldn’t retrieve ${previous} information. Your ${month()} summary is still available.`;return `<section class="comparison-card comparison-state" aria-label="Month comparison"><div class="topline"><span class="eyebrow">Month comparison</span>${state==='loading'?'<span class="spinner" aria-hidden="true"></span>':icon(state==='error'?'warning':'calendar','icon-sm')}</div><h3 ${state==='loading'?'role="status"':''}>${state==='loading'?'Checking the previous month…':state==='unavailable'?'No comparison available yet.':'Comparison is unavailable.'}</h3><p class="comparison-state-copy">${copy}</p>${state==='error'?'<button type="button" class="text-button" data-action="retry-comparison">Retry comparison</button>':state==='loading'?'<div class="skeleton comparison-skeleton" aria-hidden="true"></div>':''}</section>`}return `<div class="comparison-card"><div class="topline"><span class="eyebrow">Month at a glance</span><span class="badge success">${icon('trend','icon-sm')}${money(delta)} less</span></div><div class="comparison-amount num">${money(prior)}</div><p class="month-caption">spent in 1–22 ${previous}</p><div class="month-bars" aria-hidden="true"><div class="month-bar"></div><div class="month-bar current" style="height:${totalValue/prior*100}%"></div></div><div class="compare-labels"><span>${previous}</span><span style="color:var(--ink)">${month()}</span></div></div>`}
function statePanel(i,title,copy,action,id){return`<section class="state-panel"><div class="round-icon">${icon(i)}</div><h2>${title}</h2><p>${copy}</p><button type="button" class="btn primary" data-action="${id}">${action}${icon('arrow')}</button></section>`}
function spendingPage(){let filter=getParams().get('category')||'all',list=transactions().filter(t=>filter==='all'||t.category===filter),categories=totals();return pageHead('Everyday spending. All together.','See the details that make up your bigger picture.',{period:true})+`<div class="spending-period">${periodControl()}</div><section class="spending-total"><div><div class="eyebrow">Total spent · 1–22 ${month()} 2026</div><h2 class="num">${money(total())}</h2></div><span class="badge">${transactions().length} transactions</span></section><div class="section-head"><h2>Explore by category</h2><span class="small muted">${categories.length} categories</span></div><div class="category-scroll">${categories.map(c=>`<a class="browse-category" href="${href('category',{category:c.id})}" data-nav="category" data-category="${c.id}"><span class="round-icon ${c.tone}">${icon(c.icon)}</span><h3>${c.name}</h3><strong class="num">${money(c.amount)}</strong></a>`).join('')}</div><section><div class="spending-filter"><div><h2>All activity</h2><p class="spending-caption">${list.length} transactions · ${month()} 2026</p></div><label><span class="sr-only">Filter transactions by category</span><select aria-label="Filter transactions by category" data-spending-filter><option value="all" ${filter==='all'?'selected':''}>All categories</option>${categories.map(c=>`<option value="${c.id}" ${filter===c.id?'selected':''}>${c.name}</option>`).join('')}</select></label></div>${filter!=='all'?`<div class="spending-link">${icon(cat(filter).icon)}<a href="${href('category',{category:filter})}" data-nav="category" data-category="${filter}">View ${cat(filter).name} details</a></div>`:''}${list.length?transactionRows(list):`<div class="note-box">${icon('empty')}<div>No transactions in this category for the selected period. Choose another category to keep exploring.</div></div>`}<div class="quiet-strip">${icon('category')}<span>Open any transaction to review its details or correct its category.</span></div></section>`}
function categoryPage(){let id=getParams().get('category')||'food',c=totals().find(c=>c.id===id)||totals()[0],list=transactions().filter(t=>t.category===c.id),share=Math.round(c.amount/total()*100),state=getParams().get('state'),prior=(period==='oct'?{food:10800,shopping:8900,transport:4100,bills:6000,entertainment:4400}:{food:11200,shopping:9200,transport:4600,bills:6200,entertainment:4600})[c.id],difference=prior-c.amount;
let alert=state==='categorization-error'?`<div class="status-banner error">${icon('warning')}<div><strong>Some categories could not be assigned.</strong>You can still open a transaction and choose its category.</div></div>`:state==='uncategorized'?`<div class="status-banner">${icon('category')}<div><strong>A transaction needs a category.</strong>Open it to choose a category yourself.</div></div>`:'';
return`<a class="back-link" href="${href('overview')}" data-nav="overview">${icon('back')}Back to overview</a><div class="detail-top"><span class="eyebrow">Your spending, a little closer</span><span class="badge sample-badge">Sample data</span></div>${alert}<div class="detail-grid"><section class="category-summary"><div class="category-title"><span class="round-icon ${c.tone}">${icon(c.icon)}</span><div><h1>${c.name}</h1><p>1–22 ${month()} 2026</p></div></div><div class="category-total-label">Spent this period</div><div class="total-value num">${money(c.amount)}</div><div class="comparison"><span class="change">${icon(difference>=0?'trend':'up')}${money(Math.abs(difference))} ${difference>=0?'less':'more'}</span><span>than ${period==='oct'?'September':'August'}</span></div><div class="progress" aria-label="${share}% of total spending"><span style="width:${share}%"></span></div><div class="progress-meta"><span>${share}% of total spending</span><span>${money(total())} total</span></div><div class="category-totals"><div><span>Transactions</span><strong>${list.length}</strong></div><div><span>Average transaction</span><strong>${money(c.amount/(list.length||1))}</strong></div></div></section><aside class="category-insight">${icon('light','icon-lg')}<h3>The little things make up the bigger picture.</h3><p>Open a transaction to see its details. If a category doesn’t feel right, you can change it in a moment.</p><div class="week-bars" role="img" aria-label="Illustrative weekly distribution"><div><i style="height:36px"></i>Week 1</div><div><i style="height:64px"></i>Week 2</div><div><i style="height:88px"></i>Week 3</div><div><i style="height:50px"></i>Week 4</div></div><p class="month-detail">Illustrative weekly pattern · ${month()}</p><a class="link" href="${href('budgets')}" data-nav="budgets">Make a little room to plan ${icon('arrow')}</a></aside></div><div class="category-list-heading"><h2>Your transactions</h2><span>${list.length} transactions</span></div>${transactionRows(list)}<p class="subtle-note">Amounts and categories shown here are sample data. Open any transaction to review its category.</p>`}
function transactionPage(){let t=activeTx(),state=categorizationState(),category=shownCategory(t);return`<a class="back-link" href="${href('spending')}" data-nav="spending">${icon('back')}Back to spending</a><div class="detail-top"><h1>Transaction details</h1><span class="badge sample-badge">Sample data</span></div>${state==='categorization-error'?`<div class="status-banner error">${icon('warning')}<div><strong>Category unavailable.</strong>We couldn’t categorize this transaction. You can choose a category below.</div></div>`:''}<div class="detail-grid"><div><section class="detail-hero"><span class="round-icon">${icon(t.icon)}</span><h2 style="font-size:23px;font-weight:500">${esc(t.name)}</h2><div class="total-value num">${money(t.amount)}</div><p class="muted">${t.day} ${month()} 2026 · ${t.time}</p><div style="margin-top:16px"><span class="badge success">${icon('check','icon-sm')}Completed</span></div></section><section class="detail-info" aria-label="Transaction information"><dl><div class="info-row"><dt>Merchant</dt><dd>${esc(t.name)}</dd></div><div class="info-row"><dt>Date</dt><dd>${t.day} ${month()} 2026</dd></div><div class="info-row"><dt>Time</dt><dd>${t.time}</dd></div><div class="info-row"><dt>Description</dt><dd>${esc(t.description)}</dd></div></dl></section></div><div class="side-detail"><section class="category-panel"><div class="section-head" style="margin-bottom:0"><h2>Filed under</h2>${icon('category','icon-sm')}</div><div class="mini-head"><span class="round-icon ${category.tone}">${icon(category.icon)}</span><div><h3>${category.name}</h3><p>${category.id==='uncategorized'?'Choose a category for this transaction.':changes[period+':'+t.id]?'Updated by you':'Suggested category'}</p></div></div><p class="muted">${category.id==='uncategorized'?'A category will help this transaction find its place in your spending overview.':'Not quite the right place? You can change this transaction’s category.'}</p><a class="btn secondary full" href="${href('edit-category',{tx:t.id,...(state?{categoryState:state}:{})})}" data-nav="edit-category" data-tx="${t.id}" ${state?'data-category-state="'+state+'"':''}>${icon('edit')}Edit category</a></section><div class="note-box">${icon('light')}<div><strong>Small corrections. A clearer picture.</strong>Changing a category updates this transaction. You’ll choose separately whether to use that category for future purchases from this merchant.</div></div><div class="quiet-strip">${icon('shield')}<span>Changing a category doesn’t change the transaction amount or payment.</span></div></div></div>`}
function planningTabs(active){return`<nav class="tabs" aria-label="Planning"><a href="${href('budgets')}" data-nav="budgets" class="${active==='budgets'?'active':''}">Budgets</a><a href="${href('recurring')}" data-nav="recurring" class="${active==='recurring'?'active':''}">Recurring payments</a></nav>`}
function budgetPage(){let entries=Object.entries(budgets),catsTotal=totals(),configured=entries.reduce((a,[id,amount])=>a+Number(amount),0),spent=entries.reduce((a,[id])=>a+(catsTotal.find(c=>c.id===id)?.amount||0),0),room=configured-spent;return pageHead('A little room to plan.','Give your everyday spending a little direction.',{action:`<a class="btn primary desktop-only" href="${href('set-budget')}" data-nav="set-budget">${icon('plus')}Create budget</a>`})+planningTabs('budgets')+`<div class="proposal-line"><span class="badge">Proposed feature</span><span>Monthly category budgets</span></div><section class="budget-overview"><div><div class="eyebrow">Across your category budgets</div><div class="total-value num">${money(spent)} <span>/ ${money(configured)}</span></div><div class="budget-intro">Spent in 1–22 ${month()} 2026</div></div><div class="overview-progress"><div class="progress" aria-label="${Math.round(spent/configured*100)}% of configured budgets used"><span style="width:${Math.min(100,spent/configured*100)}%"></span></div><div class="progress-meta"><span>${Math.round(spent/configured*100)}% used</span><strong>${money(Math.abs(room))} ${room>=0?'remaining':'over'}</strong></div></div></section><div class="section-head"><h2>Your monthly budgets</h2><span class="small muted">${entries.length} categories</span></div><div class="budget-grid">${entries.map(([id,limit])=>{let c=catsTotal.find(c=>c.id===id),ratio=c.amount/limit*100,over=ratio>=100;return`<section class="budget-card"><div class="budget-head"><span class="round-icon ${c.tone}">${icon(c.icon)}</span><div class="budget-name"><h3>${c.name}</h3><p>Monthly budget</p></div></div><div class="spent num">${money(c.amount)} <span>/ ${money(limit)}</span></div><div class="progress" aria-label="${Math.round(ratio)}% used"><span style="width:${Math.min(100,ratio)}%"></span></div><div class="progress-meta"><span>${Math.round(ratio)}% used</span><span>${money(Math.abs(limit-c.amount))} ${over?'over':'left'}</span></div>${ratio>=80?`<div class="threshold-note ${over?'over':''}">${icon(over?'info':'bell')}<span><strong>${over?'100%':'80%'} threshold reached</strong><br>${c.name} ${over?'has reached its monthly budget.':'has passed 80% of its budget.'}</span></div>`:`<div class="budget-note" style="margin-top:17px">A little room for the rest of the month.</div>`}<a class="link" href="${href('set-budget',{category:id})}" data-nav="set-budget" data-category="${id}" style="font-size:11px;margin-top:8px;min-height:44px">Adjust budget ${icon('arrow')}</a></section>`}).join('')}<a class="add-budget" href="${href('set-budget')}" data-nav="set-budget"><span class="round-icon">${icon('plus')}</span><div><h3>Create a category budget</h3><p>A small plan for what matters to you.</p></div></a></div><div class="budget-helper"><h3>A heads-up, without the pressure.</h3><p>Threshold notices identify when a category reaches 80% and 100% of its monthly budget. They’re here to keep you informed, without judging how you spend. Notification channels and timing are still under product review.</p></div>`}
function recurringPage(){let state=getParams().get('state'),top=pageHead('The familiar, all together.','A closer look at payments that may repeat.')+planningTabs('recurring')+`<div class="proposal-line"><span class="badge">Proposed feature</span><span>Detected recurring payments</span></div>`;
if(state==='empty')return top+statePanel('repeat','Nothing recurring detected yet.','No recurring payments were detected in the available data. You may still have regular expenses that haven’t been identified.','Back to overview','back-overview');

const list=[{name:'Airtel Fiber',amount:2499,icon:'wifi',tone:'teal',category:'Bills & utilities',date:'25 October',day:'25',label:'Internet · Monthly'},{name:'StreamPlus',amount:1499,icon:'play',tone:'pink',category:'Entertainment',date:'1 November',day:'01',label:'Streaming · Monthly'},{name:'Tune Music',amount:649,icon:'music',tone:'lavender',category:'Entertainment',date:'5 November',day:'05',label:'Music · Monthly'}];return top+`<div class="recurring-layout"><div><section class="recurring-hero"><div class="eyebrow">Detected monthly payments</div><div class="total-value num">${money(list.reduce((a,t)=>a+t.amount,0))} <span>/ month</span></div><div class="mini-meta">${icon('repeat','icon-sm')}3 payments, gathered in one place</div></section><div class="section-head"><h2>Your recurring payments</h2></div><div class="recurring-list">${list.map(t=>`<article class="recurring-row"><div class="top"><span class="round-icon ${t.tone}">${icon(t.icon)}</span><div class="name"><h3>${t.name}</h3><p>${t.label}</p></div><div class="cost num">${money(t.amount)}<span>each month</span></div></div><div class="bottom"><span>Expected around ${t.date}</span><span class="badge">Detected pattern</span></div></article>`).join('')}</div></div><aside class="recurring-side"><section class="card"><div class="round-icon" style="margin-bottom:19px">${icon('calendar')}</div><h2 style="font-size:20px;font-weight:500;margin-bottom:12px">Know what may be coming.</h2><p class="body-copy" style="font-size:12px">These payments appear to follow a regular pattern in the sample transactions. Expected dates are estimates, not scheduled payments.</p><div class="divider"></div><div class="mini-head" style="margin-bottom:0"><span class="round-icon teal">${icon('wifi')}</span><div><h3>Next expected</h3><p>Airtel Fiber · Around 25 October</p></div></div></section><div class="note-box">${icon('info')}<div><strong>A pattern, not a guarantee.</strong>Payments can change. This view doesn’t move money, cancel services, or promise a future charge.</div></div></aside></div>`}
function dataUsePage(){return pageHead('Your data. A clearer picture.','Understand what powers your spending overview.')+`<section class="trust-hero"><span class="round-icon">${icon('shield')}</span><div><h2>Clarity starts with understanding.</h2><p>Transaction information helps organize your spending, show changes over time, and make category corrections. This preview uses illustrative transactions. No bank account is connected.</p></div></section><div class="data-grid"><section class="data-section"><h2>What the information is used for</h2><div class="data-purpose">${icon('spending')}<div><h3>Bring your spending into view</h3><p>Transaction amounts and dates are grouped into a period total, category breakdown, and month comparison.</p></div></div><div class="data-purpose">${icon('category')}<div><h3>Help things find their place</h3><p>Merchant names and descriptions support category suggestions. You can correct a category from the transaction details.</p></div></div><div class="data-purpose">${icon('repeat')}<div><h3>Remember, only when you choose</h3><p>After saving a correction, a separate choice asks whether the category should be used for future transactions from that merchant.</p></div></div><div class="note-box">${icon('lock')}<div><strong>About this preview</strong>Category and budget changes stay in this browser. They don’t change real accounts or send information to a bank.</div></div></section><section class="data-section"><h2>Choices and controls</h2><div class="policy-box"><span class="badge">Policy review pending</span><h3>Your choices need to be clear before the product connects to real data.</h3><p>Enrollment, data permissions, retention, deletion, and account-disconnection controls are awaiting product and privacy decisions. No permission has been requested or granted here.</p></div><details class="disclosure"><summary>How will enrollment work?${icon('down')}</summary><p>The decision between default enrollment and an explicit opt-in is unresolved. This design does not select either model or ask you to agree to one.</p></details><details class="disclosure"><summary>Where will my data controls be?${icon('down')}</summary><p>This page is the proposed entry point for applicable controls. Real permissions, retention, deletion, and disconnection actions must be defined and reviewed before release.</p></details><details class="disclosure"><summary>What can I change in this preview?${icon('down')}</summary><p>You can correct sample transaction categories, choose whether to remember a sample merchant, and confirm sample budgets. Those choices are stored only in this browser.</p></details><div class="local-data"><h3>Your sample changes</h3><p>You can return all categories and budgets to their original examples.</p><button class="text-button" type="button" data-action="reset-local">Reset sample changes</button></div></section></div>`}
function correctionDialog(){const t=activeTx(),original=shownCategory(t),params=getParams();if(!selectedCategory&&!categorizationState())selectedCategory=t.category;if(!saveStatus&&params.get('state')==='saved')saveStatus='saved';if(!saveStatus&&params.get('state')==='save-error'){saveStatus='error';saveFailedOnce=true;}if(!saveStatus&&params.get('state')==='saving')saveStatus='saving';let body='';
if(saveStatus==='saved'){let c=cat(selectedCategory);body=`<div class="saved-icon">${icon('check')}</div><h3 class="saved-title" tabindex="-1">A little correction. All saved.</h3><p class="saved-copy">${esc(t.name)} is now in <strong>${c.name}</strong>. The category for this transaction has been updated.</p><section class="future-box"><h3>Remember this for next time?</h3><p>Use <strong>${c.name}</strong> for future transactions from <strong>${esc(t.name)}</strong>? This is a separate choice.</p><button class="btn primary full" type="button" data-action="remember-merchant">Yes, use for this merchant</button><button class="text-button" type="button" data-action="not-now">Not now, just this transaction</button></section>`}
else{body=`<p class="dialog-intro">Choose where this transaction belongs. Your change will apply after you save it.</p><div class="dialog-tx"><span class="round-icon ${original.tone}">${icon(t.icon)}</span><div class="details"><h3>${esc(t.name)}</h3><p>${t.day} ${month(true)} · Currently ${original.name}</p></div><strong class="num">${money(t.amount)}</strong></div><fieldset style="border:0;padding:0;margin:0" ${saveStatus==='saving'?'disabled':''}><legend class="eyebrow" style="padding:0">Select a category</legend><div class="choice-list">${cats.map(c=>`<label class="choice"><span class="round-icon ${c.tone}">${icon(c.icon)}</span><span>${c.name}</span><input type="radio" name="category" value="${c.id}" ${selectedCategory===c.id?'checked':''}></label>`).join('')}</div></fieldset>${saveStatus==='error'?`<div class="status-banner error" role="alert">${icon('warning')}<div><strong>Your correction wasn’t saved.</strong>${original.name} is still the current category. Your selection is ready to try again.</div></div>`:''}<div class="dialog-actions"><button class="text-button cancel-link" data-action="cancel-edit" type="button" ${saveStatus==='saving'?'disabled':''}>Cancel</button><button class="btn primary" type="button" data-action="save-category" ${saveStatus==='saving'||!selectedCategory?'disabled':''}>${saveStatus==='saving'?'<span class="spinner"></span>Saving correction…':saveStatus==='error'?'Try saving again':'Save correction'}</button></div>`}
return`<div class="scrim" data-scrim="edit"><section class="dialog" role="dialog" tabindex="-1" aria-modal="true" aria-busy="${saveStatus==='saving'}" aria-labelledby="correction-title"><div class="dialog-handle"></div><div class="dialog-head"><h2 id="correction-title">${saveStatus==='saved'?'Category updated':'Edit category'}</h2><button class="icon-btn" data-action="${saveStatus==='saved'?'not-now':'cancel-edit'}" type="button" aria-label="Close category editor" ${saveStatus==='saving'?'disabled':''}>${icon('close')}</button></div>${body}</section></div>`}
function budgetDialog(){let configuredId=getParams().get('category');if(!budgetDraft.initialized){budgetDraft={category:configuredId&&cats.find(c=>c.id===configuredId)?configuredId:'food',amount:String(configuredId?budgets[configuredId]||12000:12000),initialized:true}}let c=cat(budgetDraft.category),amount=Number(budgetDraft.amount),used=totals().find(x=>x.id===c.id)?.amount||0,body='';
if(budgetStep==='review'){body=`<p class="dialog-intro">Take a moment to check your monthly plan. Nothing is saved until you confirm.</p><dl class="review-grid"><div class="info-row"><dt>Category</dt><dd>${c.name}</dd></div><div class="info-row"><dt>Monthly budget</dt><dd>${money(amount)}</dd></div><div class="info-row"><dt>Budget period</dt><dd>${month()} 2026</dd></div></dl><div class="form-notice">${icon('bell')}<div>Threshold notices will identify when <strong>${c.name}</strong> reaches 80% and 100% of this budget.</div></div><p class="form-hint" style="margin-top:14px">This preview saves your confirmed budget in this browser.</p><div class="dialog-actions"><button class="text-button cancel-link" data-action="budget-back" type="button">Back</button><button class="btn primary" data-action="confirm-budget" type="button">Confirm budget</button></div>`}
else{body=`<p class="dialog-intro">A small plan for one part of your everyday. You can review the details before confirming.</p><form id="budget-form"><div class="form-group"><label for="budget-category">Category</label><select class="field" id="budget-category" name="budget-category">${cats.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${x.name}</option>`).join('')}</select></div><div class="form-group"><label for="budget-amount">Monthly budget amount</label><div class="field-wrap"><span class="currency" aria-hidden="true">₹</span><input class="field" type="text" inputmode="decimal" id="budget-amount" name="budget-amount" value="${esc(budgetDraft.amount)}" autocomplete="off" aria-describedby="budget-amount-hint${budgetError?' budget-amount-error':''}" ${budgetError?'aria-invalid="true"':''}><span class="suffix">per month</span></div><p class="form-hint" id="budget-amount-hint">${money(used)} spent in ${c.name} this period.</p>${budgetError?`<p class="field-error" id="budget-amount-error" role="alert">${budgetError}</p>`:''}</div><div class="form-notice">${icon('calendar')}<div>For <strong>${month()} 2026</strong>. We’ll show the category and amount once more before you confirm.</div></div><div class="dialog-actions"><button class="text-button cancel-link" data-action="cancel-budget" type="button">Cancel</button><button class="btn primary" type="submit">Review budget ${icon('arrow')}</button></div></form>`}
return`<div class="scrim" data-scrim="budget"><section class="dialog" role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="budget-title"><div class="dialog-handle"></div><div class="dialog-head"><h2 id="budget-title">${budgetStep==='review'?'Review your budget':configuredId?'Adjust a budget':'Create a budget'}</h2><button class="icon-btn" data-action="cancel-budget" type="button" aria-label="Close budget editor">${icon('close')}</button></div>${body}</section></div>`}
function render(){const wasModal=!!document.querySelector('.dialog'),previousFocus=document.activeElement,focusId=previousFocus?.id||'',focusAction=previousFocus?.dataset?.action||'';let params=getParams(),screen=params.get('screen')||'overview',known=['overview','spending','category','transaction','edit-category','budgets','set-budget','recurring','data-use'];if(!known.includes(screen))screen='overview';document.body.classList.toggle('force-mobile',params.get('mode')==='mobile');document.body.classList.toggle('modal-open',['edit-category','set-budget'].includes(screen));let content=screen==='overview'?dashboard():screen==='spending'?spendingPage():screen==='category'?categoryPage():['transaction','edit-category'].includes(screen)?transactionPage():['budgets','set-budget'].includes(screen)?budgetPage():screen==='recurring'?recurringPage():dataUsePage();document.getElementById('app').innerHTML=layout(screen,content)+(screen==='edit-category'?correctionDialog():screen==='set-budget'?budgetDialog():'');document.title=({'overview':'Overview','spending':'Spending','category':cat(params.get('category')||'food').name,'transaction':'Transaction details','edit-category':'Edit category','budgets':'Budgets','set-budget':'Create a budget','recurring':'Recurring payments','data-use':'Data use & controls'}[screen])+' · Smart Expense Tracker';manageModalFocus(screen,wasModal,focusId,focusAction)}
function manageModalFocus(screen,wasModal,focusId,focusAction){const isModal=['edit-category','set-budget'].includes(screen);document.querySelectorAll('#app > .sidebar,#app > .app-body,#app > .bottom-nav').forEach(node=>{node.inert=isModal;if(isModal)node.setAttribute('aria-hidden','true');else node.removeAttribute('aria-hidden')});requestAnimationFrame(()=>{if(isModal){const dialog=document.querySelector('.dialog');if(!dialog)return;let target=dialog;if(saveStatus!=='saving'){target=saveStatus==='saved'?dialog.querySelector('.saved-title'):null;if(!target&&wasModal&&focusId)target=dialog.querySelector('#'+CSS.escape(focusId));if(!target&&wasModal&&focusAction)target=dialog.querySelector('[data-action="'+CSS.escape(focusAction)+'"]:not(:disabled)');if(!target&&saveStatus==='error')target=dialog.querySelector('[data-action="save-category"]');if(!target)target=dialog.querySelector('button:not(:disabled)')||dialog}target.focus({preventScroll:true})}else if(wasModal){const selector=focusReturnSelector||('[data-nav="'+(screen==='transaction'?'edit-category':'set-budget')+'"]'),candidates=[...document.querySelectorAll(selector)],target=candidates.find(el=>el.offsetParent!==null);target?.focus();focusReturnSelector=''}})}
function toast(message){clearTimeout(toastTimer);const t=document.getElementById('toast');t.innerHTML=`<div class="toast">${icon('check')}<span>${esc(message)}</span></div>`;toastTimer=setTimeout(()=>t.innerHTML='',4200)}
function closeEdit(){if(saveStatus==='saving')return;const fixture=categorizationState();go('transaction',{tx:currentTxId,...(fixture?{categoryState:fixture}:{})})}
function cancelBudget(){budgetDraft={category:'food',amount:'12000'};budgetStep='form';budgetError='';go('budgets')}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-nav]');if(nav){e.preventDefault();const next=nav.dataset.nav,extra={};if(nav.dataset.category)extra.category=nav.dataset.category;if(nav.dataset.tx)extra.tx=nav.dataset.tx;if(nav.dataset.categoryState)extra.categoryState=nav.dataset.categoryState;if(next==='set-budget')budgetDraft={category:'food',amount:'12000'};go(next,extra);return}let action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;
if(action==='retry-dashboard'){const u=new URL(location.href);u.searchParams.set('state','success');history.replaceState({},'',u);render();toast('Your overview is ready.')}else if(action==='retry-comparison'){const u=new URL(location.href);u.searchParams.delete('comparison');history.replaceState({},'',u);render();toast('Month comparison is ready.')}else if(action==='available-period'){period='oct';go('overview')}else if(action==='back-overview')go('overview');else if(action==='retry-recurring'){const u=new URL(location.href);u.searchParams.delete('state');history.replaceState({},'',u);render();toast('Recurring payments are ready.')}else if(action==='cancel-edit')closeEdit();else if(action==='save-category'){if(saveStatus==='saving')return;saveStatus='saving';render();setTimeout(()=>{if(getParams().get('screen')!=='edit-category')return;if((getParams().get('save')==='error'||getParams().get('state')==='save-error')&&!saveFailedOnce){saveFailedOnce=true;saveStatus='error';render();return}changes[period+':'+currentTxId]=selectedCategory;persist();const savedUrl=new URL(location.href);savedUrl.searchParams.delete('categoryState');if(['uncategorized','categorization-error'].includes(savedUrl.searchParams.get('state')))savedUrl.searchParams.delete('state');history.replaceState({},'',savedUrl);saveStatus='saved';render()},650)}else if(action==='not-now'){go('transaction',{tx:currentTxId});toast('Category updated for this transaction.')}else if(action==='remember-merchant'){let t=activeTx();merchantRules[t.name]=selectedCategory;persist();go('transaction',{tx:currentTxId});toast('Category saved. Merchant choice remembered.')}else if(action==='cancel-budget')cancelBudget();else if(action==='budget-back'){budgetStep='form';render()}else if(action==='confirm-budget'){budgets[budgetDraft.category]=Number(budgetDraft.amount);persist();budgetDraft={category:'food',amount:'12000'};go('budgets');toast('Your monthly budget is saved.')}else if(action==='reset-local'){changes={};budgets={food:10000,shopping:7000,transport:6000};merchantRules={};persist();render();toast('Sample categories and budgets reset.')}});
document.addEventListener('change',e=>{if(e.target.matches('[data-period]')){period=e.target.value;const u=new URL(location.href);u.searchParams.set('period',period);u.searchParams.delete('state');history.replaceState({},'',u);render()}if(e.target.name==='category'){selectedCategory=e.target.value;const saveButton=document.querySelector('[data-action="save-category"]');if(saveButton&&saveStatus!=='saving')saveButton.disabled=false;}if(e.target.id==='budget-category'){budgetDraft.category=e.target.value;let val=document.getElementById('budget-amount')?.value;if(val!==undefined)budgetDraft.amount=val;render()}});
document.addEventListener('change',e=>{if(e.target.matches('[data-spending-filter]')){const u=new URL(location.href);if(e.target.value==='all')u.searchParams.delete('category');else u.searchParams.set('category',e.target.value);history.replaceState({},'',u);render()}});
document.addEventListener('input',e=>{if(e.target.id==='budget-amount')budgetDraft.amount=e.target.value});
document.addEventListener('submit',e=>{if(e.target.id!=='budget-form')return;e.preventDefault();let raw=budgetDraft.amount.replace(/,/g,'').trim(),n=Number(raw);if(!/^\d+(\.\d{1,2})?$/.test(raw)||!Number.isFinite(n)||n<1||n>10000000){budgetError='Enter a monthly amount between ₹1 and ₹1,00,00,000.';render();document.getElementById('budget-amount')?.focus();return}budgetDraft.amount=String(n);budgetError='';budgetStep='review';render()});
document.addEventListener('keydown',e=>{const modal=document.querySelector('.dialog');if(!modal)return;if(e.key==='Escape'){if(getParams().get('screen')==='edit-category')closeEdit();else cancelBudget();return}if(e.key==='Tab'){let targets=[...modal.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),summary')].filter(el=>el.offsetParent!==null&&!el.matches(':disabled')),first=targets[0],last=targets[targets.length-1];if(!targets.length){e.preventDefault();modal.focus();return}if(document.activeElement===modal){e.preventDefault();(e.shiftKey?last:first)?.focus();return}if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
window.addEventListener('popstate',()=>{period=getParams().get('period')==='sep'?'sep':'oct';currentTxId=getParams().get('tx')||'brew';saveStatus='';selectedCategory='';saveFailedOnce=false;budgetStep='form';budgetDraft={category:'food',amount:'12000'};render()});
